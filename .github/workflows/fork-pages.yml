name: Deploy fork preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fork-pages-model-fix
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @google/model-viewer@4.4.0
          cp node_modules/@google/model-viewer/dist/model-viewer.min.js src/model-viewer.min.js
          test -s src/model-viewer.min.js
      - name: Build fork preview
        env:
          NFC_ENV: production
          NFC_DEPLOYMENT_TARGET: github-pages
          NFC_PUBLIC_ORIGIN: https://zaffirax55.github.io
          NFC_PUBLIC_BASE_PATH: /nfc-card-website
          NFC_PUBLICATION_MODE: PUBLIC_PREVIEW
          NFC_TELEGRAM_ENABLED: 'false'
        run: npm run build
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
