name: Release source validation

on:
  push:
    branches: [main, release/public-v19]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      source_tree:
        required: true
        type: string
      source_role:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nfc-validation-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_role || 'destination' }}-${{ inputs.source_sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nfc_v12_test
          POSTGRES_USER: nfc_ci
          POSTGRES_PASSWORD: nfc-ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfc_ci -d nfc_v12_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NFC_TEST_DATABASE_URL: postgresql://nfc_ci:nfc-ci-disposable-only@127.0.0.1:5432/nfc_v12_test
      NFC_TELEGRAM_ENABLED: 'false'
      NFC_BROWSER_EVIDENCE: ${{ github.workspace }}/work/qa/v12
      NFC_V13_BROWSER_EVIDENCE: ${{ github.workspace }}/work/qa/v13
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      # Exact upstream tag refs verified 2026-09-12; see PACKAGING.md.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.source_sha && 'zaffirax55/nfc-card-website' || github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Require an explicit supported source role for reusable validation
        env:
          SOURCE_ROLE: ${{ inputs.source_role }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [ -n "$SOURCE_SHA" ]; then
            case "$SOURCE_ROLE" in source-main|storefront) ;; *) exit 1 ;; esac
          else
            test -z "$SOURCE_ROLE"
          fi
      - name: Verify immutable reusable validation source
        if: github.event_name == 'workflow_call' || inputs.source_sha != ''
        env:
          EXPECTED_COMMIT: ${{ inputs.source_sha }}
          EXPECTED_TREE: ${{ inputs.source_tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
      - name: Verify clean checkout manifest
        id: initial_manifest
        run: python -B scripts/verify_manifest.py
      - name: Scan authored source, index, and complete history
        id: guard
        run: python -B scripts/release_guard.py --history
      - name: Install locked Node dependencies
        id: npm_install
        run: npm ci
      - name: Install hashed Python dependencies and Chromium
        id: python_install
        run: |
          python -m pip install --require-hashes -r requirements-test.lock
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Verify manifest after dependency installation
        id: installed_manifest
        run: python -B scripts/verify_manifest.py
      - name: Run complete sequential test suite
        id: tests
        run: npm test
      - name: Complete storefront contracts, provenance and transport
        if: inputs.source_role == 'storefront'
        run: |
          npm run designer:build
          npm run designer:seo
          npm run designer:test:contracts
          npm run designer:test:transport
          npm run designer:check
          npm run test:production
      - name: Retain ordinary destination policy validation
        if: inputs.source_role == ''
        run: npm run designer:test:contracts && npm run test:production
      - name: Build source main with its accepted PUBLIC_PREVIEW profile
        if: inputs.source_role == 'source-main'
        id: main_build
        env:
          NFC_ENV: production
          NFC_PUBLIC_ORIGIN: https://nfc-card.example
          NFC_PUBLICATION_MODE: PUBLIC_PREVIEW
          GITHUB_SHA: ${{ inputs.source_sha }}
        run: npm run build
      - name: Build storefront or ordinary destination after verified PUBLIC gate
        if: inputs.source_role != 'source-main'
        id: build
        env:
          NFC_ENV: production
          NFC_PUBLIC_ORIGIN: https://optidigitalagent.github.io
          NFC_PUBLIC_BASE_PATH: /nfc-card-website
          NFC_DEPLOYMENT_TARGET: github-pages
          NFC_PUBLICATION_MODE: PUBLIC
          NFC_REQUIRE_GATEWAY_READY: 'true'
          NFC_RELEASE_COMMIT: ${{ inputs.source_sha || github.sha }}
          NFC_PUBLISHER_WORKFLOW_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: Verify source after tests and build
        id: final_manifest
        run: |
          python -B scripts/verify_manifest.py
          python -B scripts/release_guard.py --history
      - name: Prepare concise failure diagnostics
        if: failure()
        env:
          INITIAL_MANIFEST: ${{ steps.initial_manifest.outcome }}
          RELEASE_GUARD: ${{ steps.guard.outcome }}
          NODE_INSTALL: ${{ steps.npm_install.outcome }}
          PYTHON_INSTALL: ${{ steps.python_install.outcome }}
          INSTALLED_MANIFEST: ${{ steps.installed_manifest.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          MAIN_BUILD: ${{ steps.main_build.outcome }}
          FINAL_MANIFEST: ${{ steps.final_manifest.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          names = ('INITIAL_MANIFEST', 'RELEASE_GUARD', 'NODE_INSTALL', 'PYTHON_INSTALL',
                   'INSTALLED_MANIFEST', 'TESTS', 'BUILD', 'MAIN_BUILD', 'FINAL_MANIFEST')
          allowed = {'success', 'failure', 'cancelled', 'skipped', ''}
          statuses = {name: os.environ.get(name, '') for name in names}
          assert all(value in allowed for value in statuses.values())
          output = Path('work/ci-diagnostics')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'summary.json').write_text(json.dumps({
              'step_outcomes': statuses,
              'details': 'See the failed Actions step. Raw logs, JUnit data, browser profiles and screenshots are intentionally not uploaded.'
          }, indent=2) + '\n')
          PY
      - name: Upload concise failure status only
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-failure-status
          path: work/ci-diagnostics/summary.json
          if-no-files-found: ignore
          retention-days: 7
