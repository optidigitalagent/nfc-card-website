<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">NFC CARD by Antonov Digital — reversed</title>
  <desc id="desc">Metallic NFC card mark with white wordmark for dark backgrounds.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.28" stop-color="#BFC4CB"/>
      <stop offset="0.52" stop-color="#F4F5F6"/>
      <stop offset="0.74" stop-color="#7B818A"/>
      <stop offset="1" stop-color="#DADDE1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/>
      <stop offset="1" stop-color="#6B717A"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g transform="translate(60 54)" filter="url(#shadow)">
    <g transform="rotate(-7 150 150)">
      <rect x="34" y="28" width="252" height="252" rx="28" fill="none" stroke="url(#edge)" stroke-width="12" opacity="0.85"/>
      <rect x="10" y="5" width="252" height="252" rx="28" fill="url(#metal)" stroke="#A6ABB2" stroke-width="2"/>
      <path d="M140 102 A58 58 0 0 1 140 160" fill="none" stroke="#0B0D11" stroke-width="18" stroke-linecap="round"/>
      <path d="M100 74 A94 94 0 0 1 100 188" fill="none" stroke="#0B0D11" stroke-width="18" stroke-linecap="round"/>
      <path d="M60 46 A132 132 0 0 1 60 216" fill="none" stroke="#0B0D11" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>
  <g fill="#FFFFFF" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
    <text x="390" y="190" font-size="150" font-weight="800" letter-spacing="2">NFC CARD</text>
    <text x="400" y="276" font-size="42" font-weight="400" letter-spacing="11" fill="#D5D8DD">by Antonov Digital</text>
  </g>
</svg>
